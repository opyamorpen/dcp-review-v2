name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Initialize ONES plugin workspace
        run: npx op init

      - name: Type-check backend
        run: npx tsc -p backend/tsconfig.json --noEmit

      - name: Type-check frontend
        run: npx tsc -p web/tsconfig.json --noEmit

      - name: Clear build caches
        run: rm -rf node_modules/.cache web/dist

      - name: Package plugin
        run: npx op packup --bump no-modify
